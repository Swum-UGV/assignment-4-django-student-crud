<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Create Student</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <a href="{% url 'home' %}"
       class="btn btn-secondary mb-3">
        Back
    </a>

    <div class="card p-4">

        <h1 class="text-center mb-4">
            Create Student
        </h1>

        <form method="POST">

            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Name</label>

                <input type="text"
                       name="name"
                       class="form-control"
                       placeholder="Enter Student Name..."
                       required>
            </div>


            <div class="mb-3">
                <label class="form-label">Email</label>

                <input type="email"
                       name="email"
                       class="form-control"
                       placeholder="Enter Student email..."
                       required>
            </div>


            <div class="mb-3">
                <label class="form-label">Gender</label>

                <select name="gender"
                        class="form-select"
                        required>

                    <option value="">
                        Choose gender
                    </option>

                    <option value="Male">
                        Male
                    </option>

                    <option value="Female">
                        Female
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>
            </div>


            <div class="mb-3">
                <label class="form-label">Phone</label>

                <input type="text"
                       name="phone"
                       class="form-control"
                       placeholder="Enter Student Phone..."
                       required>
            </div>


            <div class="text-end">
                <button type="submit"
                        class="btn btn-primary">
                    Submit
                </button>
            </div>

        </form>

    </div>

</div>

</body>
</html>
