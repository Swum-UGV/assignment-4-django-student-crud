<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Edit Student</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <a href="{% url 'home' %}"
       class="btn btn-secondary mb-3">
        Back
    </a>

    <div class="card p-4">

        <h1 class="text-center mb-4">
            Edit Student
        </h1>

        <form method="POST">

            {% csrf_token %}

            <div class="mb-3">

                <label class="form-label">
                    Name
                </label>

                <input type="text"
                       name="name"
                       class="form-control"
                       value="{{ student.name }}"
                       required>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Email
                </label>

                <input type="email"
                       name="email"
                       class="form-control"
                       value="{{ student.email }}"
                       required>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Gender
                </label>

                <select name="gender"
                        class="form-select"
                        required>

                    <option value="Male"
                        {% if student.gender == "Male" %}selected{% endif %}>
                        Male
                    </option>

                    <option value="Female"
                        {% if student.gender == "Female" %}selected{% endif %}>
                        Female
                    </option>

                    <option value="Other"
                        {% if student.gender == "Other" %}selected{% endif %}>
                        Other
                    </option>

                </select>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Phone
                </label>

                <input type="text"
                       name="phone"
                       class="form-control"
                       value="{{ student.phone }}"
                       required>

            </div>


            <div class="text-end">

                <button type="submit"
                        class="btn btn-primary">
                    Submit
                </button>

            </div>

        </form>

    </div>

</div>

</body>
</html>
